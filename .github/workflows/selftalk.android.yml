name: SelfTalk Android Chinese APK

on:
  push:
    branches: [selftalk/android-zh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftalk-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      THREADS: 4
      GITHUB_RELEASE: "true"
      ENVFILE: .env.public
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: "12266719"
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android build components on runner only
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Check Android localization and packaging configuration
        run: node --test apps/mobile/scripts/selftalk-android.test.cjs
      - name: Install mobile dependencies
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit
          npm run bootstrap -- --scope=mobile
      - name: Build shared packages and check translations
        run: |
          npm run tx mobile:build
          npm --prefix packages/intl run test:zh-CN
          npm --prefix packages/editor test -- src/extensions/paragraph/__tests__/chinese-typography.test.ts
          cd apps/mobile
          npx tsc --noEmit
      - name: Build production APK without uploading signing secrets
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -PunsignedRelease=true -PprBuildNumber=$((10000 + GITHUB_RUN_NUMBER))
      - name: Verify and stage unsigned APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selftalk-apk"
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/selftalk-apk/apk-info.txt"
          grep -q "package: name='app.selftalk.notes'" "$RUNNER_TEMP/selftalk-apk/apk-info.txt"
          if grep -q application-debuggable "$RUNNER_TEMP/selftalk-apk/apk-info.txt"; then exit 1; fi
          abis=$(unzip -Z1 "$apk" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | LC_ALL=C sort -u | paste -sd, -)
          test "$abis" = "arm64-v8a,armeabi-v7a"
          for abi in arm64-v8a armeabi-v7a; do
            for lib in libreactnative.so libappmodules.so libhermesvm.so; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/$lib"
            done
          done
          unzip -l "$apk" | grep 'assets/index.android.bundle'
          cp "$apk" "$RUNNER_TEMP/selftalk-apk/SelfTalk-unsigned.apk"
          cp "$tools/lib/apksigner.jar" "$RUNNER_TEMP/selftalk-apk/apksigner.jar"
          cd "$RUNNER_TEMP/selftalk-apk"
          sha256sum SelfTalk-unsigned.apk apksigner.jar > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SelfTalk-Android-unsigned
          path: ${{ runner.temp }}/selftalk-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
